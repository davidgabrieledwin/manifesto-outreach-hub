<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Manifesto | Outreach Hub</title>
<style>
:root{--bg:#f5f8fb;--white:#fff;--text:#13324c;--muted:#657888;--accent:#1171a0;--line:#dce6ed;--green:#267b4b;--yellow:#f4c730;--danger:#af3844;--radius:12px}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.app{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}.sidebar{background:#103653;color:#e8f4fa;padding:21px 15px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}.brand{padding:4px 8px 14px;border-bottom:1px solid #31576e}.brand img{width:195px;max-width:100%;height:96px;object-fit:contain;object-position:center;filter:drop-shadow(0 0 0 transparent)}.brand small{display:block;margin-top:0;color:#afc9d8;letter-spacing:.04em}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#d5e5ef;border:0;text-align:left;padding:12px 14px;border-radius:7px}.nav button:hover,.nav button.active{background:#245676;color:white}.sidebar-foot{font-size:12px;color:#b4c9d8;margin-top:auto;line-height:1.6}.main{max-width:1500px;width:100%;padding:35px clamp(18px,4vw,54px);margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}.top h1{font-size:29px;line-height:1.15;margin:0 0 6px}.top p{color:var(--muted);margin:0}.top .tools{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--text);padding:9px 14px;border-radius:7px;font-weight:600}.btn:hover{background:#edf6fb}.btn.primary{border-color:var(--accent);background:var(--accent);color:white}.btn.primary:hover{background:#095c86}.btn.danger{color:var(--danger)}.btn.small{font-size:12px;padding:5px 9px}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:19px}.kpi{border-top:3px solid var(--accent)}.kpi .value{font-size:34px;font-weight:750;line-height:1.1;margin:9px 0}.label{font-size:13px;color:var(--muted)}.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}.grid2.equal{grid-template-columns:repeat(2,minmax(0,1fr))}.section-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}.section-title h2{font-size:19px;margin:0}.section-title span{color:var(--muted);font-size:13px}.empty{color:var(--muted);padding:27px 10px;text-align:center}.table-wrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;min-width:620px}.table th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:11px 9px}.table td{border-bottom:1px solid #e9eef2;padding:13px 9px;vertical-align:top}.table tr:last-child td{border-bottom:none}.table tr:hover td{background:#f8fbfd}.sub{color:var(--muted);font-size:12px;margin-top:3px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.field,select,textarea,input[type=text],input[type=date],input[type=email],input[type=number],input[type=tel]{border:1px solid #cbd9e2;border-radius:7px;padding:10px 11px;background:white;color:var(--text);width:100%}.toolbar .field,.toolbar select{width:auto;min-width:180px}.toolbar .field{flex:1}.chip{font-size:12px;background:#eff4f7;color:#3e6275;border-radius:5px;padding:4px 7px;display:inline-block}.chip.green{background:#e3f3e8;color:#216d41}.chip.warn{background:#fff4d1;color:#7f6513}.chip.red{background:#fbe9e9;color:#a43744}.rowbtn{background:none;border:0;color:var(--accent);padding:0;font-weight:600}.rowbtn:hover{text-decoration:underline}.muted{color:var(--muted)}.line{border:0;border-top:1px solid var(--line);margin:20px 0}.template-list{display:grid;gap:10px}.template-item{text-align:left;border:1px solid var(--line);background:white;padding:14px;border-radius:7px;color:var(--text)}.template-item:hover,.template-item.selected{border-color:var(--accent);background:#f2f9fd}.template-item strong{display:block}.template-item small{color:var(--muted)}.template-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.tpl-editor{min-height:260px;white-space:pre-wrap;font-family:inherit;line-height:1.5}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.form-group small{color:var(--muted)}.activity{padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.activity strong{font-size:13px}.activity .sub{line-height:1.5}.bar-row{display:grid;grid-template-columns:145px 1fr 36px;align-items:center;gap:12px;margin:13px 0;font-size:13px}.bar{background:#e8eef2;height:10px;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.notice{padding:13px 15px;border-left:3px solid #c28d0b;background:#fff8e7;color:#6b5418;font-size:13px;margin:0 0 20px}.content-note{font-size:13px;color:var(--muted)}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0f243b88;display:flex;justify-content:center;align-items:center;z-index:10;padding:20px}.modal{background:white;border-radius:11px;max-height:92vh;overflow:auto;width:min(710px,100%);padding:25px}.modal h2{margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;bottom:22px;right:22px;background:#163f5d;color:#fff;padding:12px 18px;border-radius:8px;z-index:99;box-shadow:0 6px 20px #102b3a33}.checklist{margin:0;padding-left:20px}.checklist li{margin-bottom:9px}.callout{font-size:13px;border:1px solid var(--line);padding:12px;background:#f8fbfd;border-radius:7px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.fine{font-size:12px;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid2.equal{grid-template-columns:1fr}.template-layout{grid-template-columns:1fr}.template-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:690px){.app{display:block}.sidebar{height:auto;position:static;padding:12px}.brand{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:9px}.sidebar-foot{display:none}.main{padding:21px 13px}.top{flex-direction:column}.top h1{font-size:25px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}.form-row,.form-row.three{grid-template-columns:1fr}.template-list{grid-template-columns:1fr}.toolbar .field,.toolbar select{width:100%}.bar-row{grid-template-columns:100px 1fr 25px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><img src="manifesto-logo.png" alt="Manifesto Malaysian Policy Tracker"/><small>OUTREACH HUB</small></div><nav class="nav" aria-label="Main navigation"><button data-page="dashboard" class="active">Dashboard</button><button data-page="contacts">Contacts & pipeline</button><button data-page="templates">Message templates</button><button data-page="followups">Follow-ups</button><button data-page="settings">Data & settings</button></nav><div class="sidebar-foot">Private, browser-based workspace<br/>No paid service required<br/><span id="savedAt">Stored on this device</span></div></aside>
<main class="main"><div id="page"></div></main>
</div><div id="modalRoot"></div><div id="toastRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
'use strict';
const KEY='manifesto_outreach_hub_v1';
let supabaseClient=null,currentUser=null,syncTimer=null,cloudReady=false;
const audiences=['Think tank','Politician','NGO / NPO','Company','VC / Angel investor','Foreign foundation','University / Academic','Media / Journalist','Mentor / Founder','Other'];
const channels=['Email','WhatsApp','LinkedIn','Phone call'];
const stages=['Not contacted','Contacted','Replied','Meeting scheduled','In discussion','Pilot interested','Partnership agreed','Not interested'];
const aims=['Idea discussion','Beta onboarding','Feedback','Partnership','Funding','Advice'];
const seedTemplates=[
{title:'Research collaboration',audience:'Think tank',channel:'Email',aim:'Feedback',subject:'Exploring research collaboration | Manifesto',body:`Dear {{name}},\n\nMy name is {{sender}}, founder of Manifesto, an early-stage Malaysian civic technology platform that helps citizens track political manifesto commitments and policy progress.\n\nGiven {{organization}}'s work in {{topic}}, I would appreciate your perspective on our research methods, evidence verification and approach to public accountability.\n\nWould you be open to a 20-minute discussion to exchange ideas and explore possible research collaboration?\n\nYou can view our early prototype at https://manifesto-tracker-zeta.vercel.app/\n\nBest regards,\n{{sender}}\nFounder | Manifesto`},
{title:'Politician beta invitation',audience:'Politician',channel:'Email',aim:'Beta onboarding',subject:'Invitation to explore the Manifesto dashboard',body:`Dear YB {{name}},\n\nI am {{sender}}, founder of Manifesto. We are developing a platform where citizens can follow commitments made by elected representatives.\n\nOur proposed politician dashboard lets representatives submit progress updates and supporting evidence. Independent verification will determine public progress ratings.\n\nWe are preparing a small beta programme. Would you or a member of your team be available for a 15–20-minute discussion and product feedback?\n\nPrototype: https://manifesto-tracker-zeta.vercel.app/\n\nThank you for your consideration.\n{{sender}}`},
{title:'NGO collaboration',audience:'NGO / NPO',channel:'Email',aim:'Partnership',subject:'Potential civic engagement collaboration | Manifesto',body:`Dear {{name}},\n\nI am {{sender}}, founder of Manifesto, an early-stage Malaysian platform helping citizens follow political promises and policy progress.\n\nWe are exploring partnerships in civic education, community engagement and beta-user recruitment. I would welcome a brief conversation about whether this work aligns with {{organization}}'s activities.\n\nWould a 20-minute introduction be possible?\n\nPrototype: https://manifesto-tracker-zeta.vercel.app/\n\nBest regards,\n{{sender}}`},
{title:'Company partnership',audience:'Company',channel:'Email',aim:'Partnership',subject:'Exploring a potential partnership with Manifesto',body:`Dear {{name}},\n\nI'm {{sender}}, founder of Manifesto, a Malaysian startup developing a public platform for tracking political commitments and policy progress.\n\nWe are looking for relevant partners in technology, civic education and community engagement. I would be glad to discuss whether there is a useful way to collaborate with {{organization}}.\n\nAre you available for a short introductory call?\n\nRegards,\n{{sender}}`},
{title:'Investor introduction',audience:'VC / Angel investor',channel:'Email',aim:'Funding',subject:'Pre-seed introduction | Manifesto Malaysian Policy Tracker',body:`Dear {{name}},\n\nI am {{sender}}, founder of Manifesto, an early-stage Malaysian civic technology startup. We have an initial prototype that organises political commitments into searchable dashboards. We are working to validate demand with citizens and political representatives.\n\nOur proposed business model includes a free citizen tier, optional ad-free subscriptions and paid politician workspace tools, with independent evidence verification.\n\nI am reaching out to seek feedback on our investment thesis and understand whether Manifesto aligns with {{organization}}'s interests. Would you be open to a short introductory call?\n\nPrototype: https://manifesto-tracker-zeta.vercel.app/\n\nBest regards,\n{{sender}}`},
{title:'Grant eligibility enquiry',audience:'Foreign foundation',channel:'Email',aim:'Funding',subject:'Grant eligibility enquiry | Malaysian civic technology',body:`Dear {{name}},\n\nI am {{sender}}, founder of Manifesto, an early-stage Malaysian civic technology initiative that helps people track commitments made by politicians, parties and coalitions.\n\nThe project supports public access to information and accountable institutions, which are relevant to UN SDG 16.\n\nCould you advise whether {{organization}} offers relevant grant programmes, capacity-building support or introductions? We are currently at prototype and early validation stage.\n\nI can share a concept note and product demonstration if useful.\n\nKind regards,\n{{sender}}`},
{title:'LinkedIn connection request',audience:'Other',channel:'LinkedIn',aim:'Advice',subject:'',body:`Hi {{name}}, I'm building Manifesto, a Malaysian platform for tracking political commitments and policy progress. I came across your work at {{organization}} and would appreciate connecting and learning from your experience.`},
{title:'LinkedIn follow-up',audience:'Other',channel:'LinkedIn',aim:'Idea discussion',subject:'',body:`Hi {{name}}, thank you for connecting. I'm developing Manifesto, a Malaysian Policy Tracker. We're gathering early feedback and looking for relevant collaborators. Would you be open to a 15–20-minute virtual discussion?`},
{title:'WhatsApp introduction',audience:'Other',channel:'WhatsApp',aim:'Feedback',subject:'',body:`Hi {{name}}, I'm {{sender}}, founder of Manifesto, a Malaysian startup developing a platform to help people track political promises and policy progress. I came across {{organization}}'s work and would appreciate a brief 15–20-minute discussion to gather feedback. Our prototype: https://manifesto-tracker-zeta.vercel.app/ Thank you!`},
{title:'Phone call introduction',audience:'Other',channel:'Phone call',aim:'Idea discussion',subject:'',body:`Good morning. My name is {{sender}}, and I'm calling on behalf of Manifesto, a Malaysian civic technology startup.\n\nMay I speak to the person responsible for partnerships, research or innovation?\n\nWe're developing a platform that helps citizens track political manifesto commitments and policy progress. We're gathering feedback and exploring collaboration with {{organization}}. Would a 15–20-minute introductory meeting be possible?\n\nIf busy: Could I send a short email describing the project and follow up at a more convenient time?`},
{title:'First email follow-up',audience:'Other',channel:'Email',aim:'Idea discussion',subject:'Following up | Manifesto introduction',body:`Dear {{name}},\n\nI wanted to follow up on my earlier message about Manifesto, our Malaysian civic technology platform for tracking political commitments.\n\nI understand you have a busy schedule. I would appreciate a brief conversation if the work is relevant to {{organization}}.\n\nThank you for your consideration.\n\nBest regards,\n{{sender}}`},
{title:'Final email follow-up',audience:'Other',channel:'Email',aim:'Idea discussion',subject:'Final follow-up | Manifesto',body:`Dear {{name}},\n\nI wanted to make one final follow-up about Manifesto. I understand this may not be the right time. If the project is relevant later, I would be happy to reconnect.\n\nThank you for considering my request.\n\nBest regards,\n{{sender}}`}
];
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{if(!d)return '—';const x=new Date(d+'T12:00:00');return Number.isNaN(+x)?d:x.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const opts=(arr,val)=>arr.map(x=>`<option value="${clean(x)}" ${x===val?'selected':''}>${clean(x)}</option>`).join('');
const blank=()=>({contacts:[],activities:[],templates:seedTemplates.map(t=>({...t,id:uuid(),builtin:true})),settings:{sender:'[Your Name]'},revision:1});
let db;try{const saved=JSON.parse(localStorage.getItem(KEY));db=(saved&&Array.isArray(saved.contacts)&&Array.isArray(saved.templates)&&Array.isArray(saved.activities))?saved:blank()}catch{db=blank()}
let page='dashboard',editingContact=null,selectedTemplate=db.templates[0]?.id,contactFilter='',stageFilter='',audienceFilter='',tplFilter='',selectedContactForTemplate='',editTemplate=null;
function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
  document.getElementById('savedAt').textContent=currentUser?'Syncing securely…':'Sign in to sync';
  if(currentUser&&cloudReady){clearTimeout(syncTimer);syncTimer=setTimeout(syncToCloud,350)}
}
function contactToRow(c){return {id:c.id,user_id:currentUser.id,name:c.name,organization:c.organization||'',title:c.title||'',audience:c.audience,goal:c.goal,stage:c.stage,channel:c.channel,email:c.email||'',phone:c.phone||'',linkedin:c.linkedin||'',last_contact:c.lastContact||null,next_followup:c.nextFollowup||null,notes:c.notes||''}}
function rowToContact(r){return {id:r.id,name:r.name,organization:r.organization,title:r.title,audience:r.audience,goal:r.goal,stage:r.stage,channel:r.channel,email:r.email,phone:r.phone,linkedin:r.linkedin,lastContact:r.last_contact||'',nextFollowup:r.next_followup||'',notes:r.notes||'',createdAt:r.created_at?.slice(0,10)||today()}}
function activityToRow(a){return {id:a.id,user_id:currentUser.id,contact_id:a.contactId,activity_date:a.date,activity_type:a.type,notes:a.notes}}
function rowToActivity(r){return {id:r.id,contactId:r.contact_id,date:r.activity_date,type:r.activity_type,notes:r.notes}}
function templateToRow(t){return {id:t.id,user_id:currentUser.id,title:t.title,audience:t.audience,channel:t.channel,aim:t.aim,subject:t.subject||'',body:t.body,is_builtin:!!t.builtin}}
function rowToTemplate(r){return {id:r.id,title:r.title,audience:r.audience,channel:r.channel,aim:r.aim,subject:r.subject,body:r.body,builtin:r.is_builtin}}
function showCloudError(error){console.error(error);toast('Cloud sync failed. Your local changes are kept; retry when online.')}
async function syncToCloud(){
  if(!currentUser||!supabaseClient)return;
  try{
    const contactRows=db.contacts.map(contactToRow),activityRows=db.activities.map(activityToRow),templateRows=db.templates.map(templateToRow);
    if(contactRows.length){const {error}=await supabaseClient.from('contacts').upsert(contactRows);if(error)throw error}
    if(activityRows.length){const {error}=await supabaseClient.from('activities').upsert(activityRows);if(error)throw error}
    if(templateRows.length){const {error}=await supabaseClient.from('templates').upsert(templateRows);if(error)throw error}
    const {error}=await supabaseClient.from('user_settings').upsert({user_id:currentUser.id,sender_name:db.settings.sender||''});if(error)throw error;
    document.getElementById('savedAt').textContent='Synced securely';
  }catch(error){showCloudError(error)}
}
async function syncFromCloud(){
  if(!currentUser||!supabaseClient)return;
  const [contacts,activities,templates,settings]=await Promise.all([
    supabaseClient.from('contacts').select('*').order('next_followup',{ascending:true}),
    supabaseClient.from('activities').select('*').order('activity_date',{ascending:false}),
    supabaseClient.from('templates').select('*').order('updated_at',{ascending:false}),
    supabaseClient.from('user_settings').select('*').maybeSingle()
  ]);
  for(const result of [contacts,activities,templates,settings])if(result.error)throw result.error;
  db={contacts:contacts.data.map(rowToContact),activities:activities.data.map(rowToActivity),templates:templates.data.length?templates.data.map(rowToTemplate):seedTemplates.map(t=>({...t,id:uuid(),builtin:true})),settings:{sender:settings.data?.sender_name||'[Your Name]'},revision:1};
  selectedTemplate=db.templates[0]?.id;localStorage.setItem(KEY,JSON.stringify(db));render();
  if(!templates.data.length)await syncToCloud();
  document.getElementById('savedAt').textContent='Synced securely';
}
async function removeCloud(table,id){if(!currentUser||!supabaseClient)return;const {error}=await supabaseClient.from(table).delete().eq('id',id);if(error)showCloudError(error)}
async function clearCloud(){if(!currentUser||!supabaseClient)return;try{await Promise.all(['activities','contacts','templates'].map(table=>supabaseClient.from(table).delete().eq('user_id',currentUser.id)));await supabaseClient.from('user_settings').delete().eq('user_id',currentUser.id)}catch(error){showCloudError(error)}}
function authModal(message='Sign in to keep your outreach records private and synchronized across devices.'){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Manifesto Outreach Hub</h2><p class="content-note">${clean(message)}</p><form onsubmit="submitAuth(event)"><div class="form-group"><label>Email</label><input name="email" type="email" required autocomplete="email"/></div><div class="form-group"><label>Password</label><input name="password" type="password" required minlength="8" autocomplete="current-password"/></div><div class="modal-actions"><button class="btn" type="button" onclick="signUpAuth()">Create account</button><button class="btn primary" type="submit">Sign in</button></div></form><p class="fine">Your password is handled directly by Supabase and is never stored in this website or GitHub.</p></div></div>`
}
async function submitAuth(event){event.preventDefault();const form=new FormData(event.target);const {error}=await supabaseClient.auth.signInWithPassword({email:form.get('email'),password:form.get('password')});if(error)authModal(error.message)}
async function signUpAuth(){const form=document.querySelector('#modalRoot form');if(!form.reportValidity())return;const data=new FormData(form);const {error}=await supabaseClient.auth.signUp({email:data.get('email'),password:data.get('password'),options:{emailRedirectTo:location.href}});authModal(error?'Account creation failed: '+error.message:'Check your email to verify your account, then sign in.')}
async function signOutAuth(){await supabaseClient.auth.signOut();currentUser=null;cloudReady=false;db=blank();render();authModal()}
async function initialiseCloud(){
  try{const config=window.getManifestoSupabaseConfig();supabaseClient=window.supabase.createClient(config.url,config.publishableKey);const {data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;cloudReady=true;currentUser=session?.user||null;if(currentUser){await syncFromCloud()}else authModal();supabaseClient.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(currentUser){closeModal();cloudReady=true;try{await syncFromCloud()}catch(error){showCloudError(error)}}});}
  catch(error){authModal('Cloud setup is incomplete. Add your Supabase Project URL and publishable key to config.js, then refresh.');console.error(error)}
}
function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.getElementById('toastRoot').append(el);setTimeout(()=>el.remove(),2700)}
function goto(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.page)));
function pagehead(title,desc,buttons=''){return `<header class="top"><div><h1>${title}</h1><p>${desc}</p></div><div class="tools">${buttons}</div></header>`}
function summary(){const total=db.contacts.length,contacted=db.contacts.filter(c=>c.stage!=='Not contacted').length,meetings=db.contacts.filter(c=>['Meeting scheduled','In discussion','Pilot interested','Partnership agreed'].includes(c.stage)).length,pilots=db.contacts.filter(c=>c.stage==='Pilot interested'||c.stage==='Partnership agreed').length,due=db.contacts.filter(c=>c.nextFollowup&&c.nextFollowup<=today()&&!['Not interested','Partnership agreed'].includes(c.stage)).length;return {total,contacted,meetings,pilots,due}}
function renderDashboard(){let s=summary(),stagesCount=stages.map(x=>[x,db.contacts.filter(c=>c.stage===x).length]).filter(x=>x[1]>0),upcoming=db.contacts.filter(c=>c.nextFollowup&&!['Not interested','Partnership agreed'].includes(c.stage)).sort((a,b)=>a.nextFollowup.localeCompare(b.nextFollowup)).slice(0,7),recent=[...db.activities].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);return `${pagehead('Your outreach at a glance','Track conversations and follow-ups for Manifesto.',`<button class="btn primary" onclick="openContact()">+ Add contact</button>`)}<div class="notice">This workspace saves only in this browser. Export a backup regularly. There is no shared account, cloud sync or automatic messaging.</div><div class="kpis"><div class="card kpi"><div class="label">Contacts</div><div class="value">${s.total}</div><div class="sub">People and organisations added</div></div><div class="card kpi"><div class="label">Contacted</div><div class="value">${s.contacted}</div><div class="sub">Reached out at least once</div></div><div class="card kpi"><div class="label">Meetings / discussions</div><div class="value">${s.meetings}</div><div class="sub">Current pipeline stages</div></div><div class="card kpi"><div class="label">Follow-ups due</div><div class="value">${s.due}</div><div class="sub">Due today or earlier</div></div></div><div class="grid2"><section class="card"><div class="section-title"><h2>Outreach pipeline</h2><span>${s.total} total</span></div>${stagesCount.length?stagesCount.map(([n,v])=>`<div class="bar-row"><span>${clean(n)}</span><div class="bar"><span style="width:${s.total?100*v/s.total:0}%"></span></div><strong>${v}</strong></div>`).join(''):'<div class="empty">Add contacts to see your pipeline.</div>'}</section><section class="card"><div class="section-title"><h2>Next follow-ups</h2><button class="rowbtn" onclick="goto('followups')">View all</button></div>${upcoming.length?upcoming.map(c=>`<div class="activity"><strong>${clean(c.name||c.organization)}</strong> <span class="chip ${c.nextFollowup<=today()?'warn':''}">${fmt(c.nextFollowup)}</span><div class="sub">${clean(c.organization)} · ${clean(c.goal)}</div></div>`).join(''):'<div class="empty">No follow-ups scheduled.</div>'}</section></div><div class="grid2 equal" style="margin-top:18px"><section class="card"><div class="section-title"><h2>Recent activity</h2></div>${recent.length?recent.map(a=>`<div class="activity"><strong>${fmt(a.date)} · ${clean(a.type)}</strong><div class="sub">${clean(db.contacts.find(c=>c.id===a.contactId)?.name||'Deleted contact')} · ${clean(a.notes)}</div></div>`).join(''):'<div class="empty">Log an email, call or meeting to see activities.</div>'}</section><section class="card"><div class="section-title"><h2>Suggested first steps</h2></div><ol class="checklist"><li>Add your first 10 prospective contacts.</li><li>Personalise a template for each audience.</li><li>Log each actual email, call or message.</li><li>Schedule one follow-up date per active contact.</li><li>Export a backup at the end of each week.</li></ol><p class="content-note">Avoid adding unverified endorsements, user numbers or funding claims to messages.</p></section></div>`}
function contactRow(c){let activity=db.activities.filter(a=>a.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date))[0];return `<tr><td><button class="rowbtn" onclick="openContact('${c.id}')">${clean(c.name||'(Unnamed contact)')}</button><div class="sub">${clean(c.title||'')} ${c.title&&c.organization?'·':''} ${clean(c.organization||'')}</div></td><td>${clean(c.audience)}</td><td><span class="chip ${c.stage==='Partnership agreed'?'green':c.stage==='Not interested'?'red':''}">${clean(c.stage)}</span><div class="sub">${clean(c.goal)}</div></td><td>${clean(c.channel)}</td><td>${fmt(c.nextFollowup)}${c.nextFollowup&&c.nextFollowup<=today()?'<div class="sub" style="color:#ad6817">Due</div>':''}</td><td>${activity?fmt(activity.date):'—'}</td><td><div class="buttons"><button class="btn small" onclick="openActivity('${c.id}')">Log</button><button class="btn small" onclick="useContact('${c.id}')">Message</button></div></td></tr>`}
function renderContacts(){const arr=db.contacts.filter(c=>[c.name,c.organization,c.title,c.email,c.notes].join(' ').toLowerCase().includes(contactFilter.toLowerCase())&&(!stageFilter||c.stage===stageFilter)&&(!audienceFilter||c.audience===audienceFilter)).sort((a,b)=>(a.nextFollowup||'9999').localeCompare(b.nextFollowup||'9999'));return `${pagehead('Contacts and pipeline','Keep each relationship, purpose and next action in one place.',`<button class="btn primary" onclick="openContact()">+ Add contact</button>`)}<section class="card"><div class="toolbar"><input class="field" type="text" placeholder="Search name or organisation" value="${clean(contactFilter)}" oninput="contactFilter=this.value;refreshContactTable()"/><select onchange="stageFilter=this.value;refreshContactTable()"><option value="">All stages</option>${opts(stages,stageFilter)}</select><select onchange="audienceFilter=this.value;refreshContactTable()"><option value="">All audiences</option>${opts(audiences,audienceFilter)}</select></div><div class="table-wrap" id="contactTable">${renderContactTable(arr)}</div></section>`}
function renderContactTable(arr){return arr.length?`<table class="table"><thead><tr><th>Contact</th><th>Audience</th><th>Stage / goal</th><th>Channel</th><th>Follow-up</th><th>Last activity</th><th>Actions</th></tr></thead><tbody>${arr.map(contactRow).join('')}</tbody></table>`:'<div class="empty">No contacts match the filters.</div>'}
function refreshContactTable(){const arr=db.contacts.filter(c=>[c.name,c.organization,c.title,c.email,c.notes].join(' ').toLowerCase().includes(contactFilter.toLowerCase())&&(!stageFilter||c.stage===stageFilter)&&(!audienceFilter||c.audience===audienceFilter)).sort((a,b)=>(a.nextFollowup||'9999').localeCompare(b.nextFollowup||'9999'));document.getElementById('contactTable').innerHTML=renderContactTable(arr)}
function renderTemplates(){let templates=db.templates.filter(t=>[t.title,t.audience,t.channel,t.aim].join(' ').toLowerCase().includes(tplFilter.toLowerCase()));let t=db.templates.find(x=>x.id===selectedTemplate)||templates[0]||db.templates[0];if(t)selectedTemplate=t.id;let ct=db.contacts.find(x=>x.id===selectedContactForTemplate);return `${pagehead('Message templates','Save, customise and copy outreach messages.',`<button class="btn primary" onclick="openTemplate()">+ New template</button>`)}<div class="template-layout"><section class="card"><div class="toolbar"><input class="field" placeholder="Find a template" value="${clean(tplFilter)}" oninput="tplFilter=this.value;render()"/></div><div class="template-list">${templates.map(x=>`<button class="template-item ${x.id===selectedTemplate?'selected':''}" onclick="selectedTemplate='${x.id}';render()"><strong>${clean(x.title)}</strong><small>${clean(x.channel)} · ${clean(x.audience)} · ${clean(x.aim)}</small></button>`).join('')||'<div class="empty">No templates found</div>'}</div></section><section class="card">${t?`<div class="section-title"><h2>${clean(t.title)}</h2><div class="buttons"><button class="btn small" onclick="openTemplate('${t.id}')">Edit</button><button class="btn small danger" onclick="deleteTemplate('${t.id}')">Delete</button></div></div><p class="sub">${clean(t.audience)} · ${clean(t.channel)} · ${clean(t.aim)}</p><hr class="line"/><div class="form-group"><label>Insert contact details</label><select id="templateContact" onchange="selectedContactForTemplate=this.value;render()"><option value="">No contact selected</option>${db.contacts.map(c=>`<option value="${c.id}" ${c.id===selectedContactForTemplate?'selected':''}>${clean(c.name)} · ${clean(c.organization)}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label>Recipient's name</label><input id="customName" value="${clean(ct?.name||'')}" placeholder="[Name]" oninput="updatePreview()"/></div><div class="form-group"><label>Organisation</label><input id="customOrg" value="${clean(ct?.organization||'')}" placeholder="[Organisation]" oninput="updatePreview()"/></div></div><div class="form-group"><label>Relevant topic or project</label><input id="customTopic" placeholder="e.g. policy research" oninput="updatePreview()"/></div>${t.subject?`<div class="form-group"><label>Subject</label><input id="subjectPreview" readonly/></div>`:''}<div class="form-group"><label>Personalised message</label><textarea id="bodyPreview" class="tpl-editor" readonly></textarea></div><div class="buttons"><button class="btn primary" onclick="copyTemplate('${t.id}')">Copy message</button>${t.subject?`<button class="btn" onclick="copySubject('${t.id}')">Copy subject</button>`:''}</div><p class="fine">Placeholders {{name}}, {{organization}}, {{topic}} and {{sender}} are filled from the fields above and your settings. Review the final message before sending.</p>`:'<div class="empty">Select or create a template.</div>'}</section></div>`}
function fillTemplate(txt){const name=document.getElementById('customName')?.value?.trim()||'[Name]',organization=document.getElementById('customOrg')?.value?.trim()||'[Organisation Name]',topic=document.getElementById('customTopic')?.value?.trim()||'[Relevant Area]',sender=db.settings.sender||'[Your Name]';return txt.replace(/{{\s*(name|organization|topic|sender)\s*}}/g,(_,k)=>({name,organization,topic,sender}[k]))}
function updatePreview(){const t=db.templates.find(x=>x.id===selectedTemplate);if(!t)return;document.getElementById('bodyPreview').value=fillTemplate(t.body);if(t.subject)document.getElementById('subjectPreview').value=fillTemplate(t.subject)}
async function copyText(v){try{await navigator.clipboard.writeText(v);toast('Copied to clipboard')}catch{const ta=document.createElement('textarea');ta.value=v;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied to clipboard')}}
function copyTemplate(id){const t=db.templates.find(x=>x.id===id);copyText(fillTemplate(t.body))}
function copySubject(id){const t=db.templates.find(x=>x.id===id);copyText(fillTemplate(t.subject))}
function useContact(id){selectedContactForTemplate=id;goto('templates')}
function renderFollowups(){let arr=db.contacts.filter(c=>c.nextFollowup&&!['Partnership agreed','Not interested'].includes(c.stage)).sort((a,b)=>a.nextFollowup.localeCompare(b.nextFollowup));return `${pagehead('Follow-ups','See the next action for each active conversation.',`<button class="btn primary" onclick="openContact()">+ Add contact</button>`)}<section class="card"><div class="section-title"><h2>Scheduled follow-ups</h2><span>${arr.length} open</span></div>${arr.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Due</th><th>Contact</th><th>Reason</th><th>Stage</th><th>Action</th></tr></thead><tbody>${arr.map(c=>`<tr><td><span class="chip ${c.nextFollowup<=today()?'warn':''}">${fmt(c.nextFollowup)}</span></td><td><button class="rowbtn" onclick="openContact('${c.id}')">${clean(c.name)}</button><div class="sub">${clean(c.organization)}</div></td><td>${clean(c.goal)}</td><td>${clean(c.stage)}</td><td><button class="btn small" onclick="openActivity('${c.id}')">Log follow-up</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No upcoming follow-ups. Add a next follow-up date to any contact.</div>'}</section><div class="callout" style="margin-top:15px">Follow-ups are shown here when you open the app. This site does not send push notifications, emails or WhatsApp reminders.</div>`}
function renderSettings(){return `${pagehead('Data and settings','Back up your work and manage your sender details.')}<div class="grid2 equal"><section class="card"><h2>Sender profile</h2><p class="content-note">Used to personalise the message templates.</p><div class="form-group"><label>Your display name</label><input id="sender" value="${clean(db.settings.sender||'')}"/></div><button class="btn primary" onclick="db.settings.sender=document.getElementById('sender').value.trim();save();toast('Sender profile saved')">Save sender</button></section><section class="card"><h2>Backups</h2><p class="content-note">Download a JSON backup to preserve contacts, templates, activities and settings, or a CSV export of contacts for Excel and Google Sheets.</p><div class="buttons"><button class="btn primary" onclick="exportJSON()">Export full backup</button><button class="btn" onclick="exportCSV()">Export contacts CSV</button><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button></div><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importJSON(this.files[0])"/><p class="fine">Import replaces your existing data. Export a backup first.</p></section></div><section class="card" style="margin-top:18px"><h2>Privacy, sync and access</h2><p>Contacts, activities, templates and sender settings are stored in your Supabase account and are isolated by row-level security. GitHub Pages hosts only the application files; it does not store your outreach data.</p><p>Use legitimate business contacts, obtain consent where appropriate, and keep exports private. The public browser configuration uses a publishable key only—never a service-role key.</p><hr class="line"/><div class="buttons"><button class="btn" onclick="signOutAuth()">Sign out</button><button class="btn danger" onclick="clearData()">Delete all cloud and local data</button></div></section>`}
function render(){const root=document.getElementById('page');root.innerHTML=page==='dashboard'?renderDashboard():page==='contacts'?renderContacts():page==='templates'?renderTemplates():page==='followups'?renderFollowups():renderSettings();if(page==='templates')updatePreview()}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openContact(id){const c=db.contacts.find(x=>x.id===id)||{name:'',organization:'',title:'',audience:'Think tank',goal:'Feedback',stage:'Not contacted',channel:'Email',email:'',phone:'',linkedin:'',lastContact:'',nextFollowup:'',notes:''};editingContact=id||null;modal(`<h2>${id?'Edit contact':'Add contact'}</h2><form id="contactForm" onsubmit="submitContact(event)"><div class="form-row"><div class="form-group"><label>Name *</label><input name="name" required value="${clean(c.name)}"/></div><div class="form-group"><label>Organisation</label><input name="organization" value="${clean(c.organization)}"/></div><div class="form-group"><label>Role / title</label><input name="title" value="${clean(c.title)}"/></div><div class="form-group"><label>Audience</label><select name="audience">${opts(audiences,c.audience)}</select></div><div class="form-group"><label>Main objective</label><select name="goal">${opts(aims,c.goal)}</select></div><div class="form-group"><label>Pipeline stage</label><select name="stage">${opts(stages,c.stage)}</select></div><div class="form-group"><label>Channel</label><select name="channel">${opts(channels,c.channel)}</select></div><div class="form-group"><label>Email</label><input name="email" type="email" value="${clean(c.email)}"/></div><div class="form-group"><label>Phone / WhatsApp</label><input name="phone" value="${clean(c.phone)}"/></div><div class="form-group"><label>LinkedIn URL</label><input name="linkedin" value="${clean(c.linkedin)}"/></div><div class="form-group"><label>Next follow-up</label><input name="nextFollowup" type="date" value="${clean(c.nextFollowup)}"/></div><div class="form-group"><label>Last contact</label><input name="lastContact" type="date" value="${clean(c.lastContact)}"/></div></div><div class="form-group"><label>Notes</label><textarea name="notes" rows="3">${clean(c.notes)}</textarea></div><div class="modal-actions">${id?`<button type="button" class="btn danger" onclick="deleteContact('${id}')">Delete</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save contact</button></div></form>`) }
function submitContact(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.name=o.name.trim();if(!o.name)return;const old=db.contacts.find(x=>x.id===editingContact);if(old)Object.assign(old,o);else db.contacts.push({...o,id:uuid(),createdAt:today()});save();closeModal();render();toast('Contact saved')}
function deleteContact(id){if(!confirm('Delete this contact and all its logged activities?'))return;db.contacts=db.contacts.filter(x=>x.id!==id);db.activities=db.activities.filter(x=>x.contactId!==id);removeCloud('contacts',id);save();closeModal();render();toast('Contact deleted')}
function openActivity(id){const c=db.contacts.find(x=>x.id===id);if(!c)return;modal(`<h2>Log activity for ${clean(c.name)}</h2><form onsubmit="submitActivity(event,'${id}')"><div class="form-row"><div class="form-group"><label>Date *</label><input type="date" name="date" required value="${today()}"/></div><div class="form-group"><label>Activity type</label><select name="type">${opts(['Email sent','WhatsApp sent','LinkedIn message','Phone call','Meeting','Reply received','Other'],'Email sent')}</select></div></div><div class="form-group"><label>What happened? *</label><textarea name="notes" rows="4" required placeholder="Record what you discussed, the outcome and what you promised to do."></textarea></div><div class="form-row"><div class="form-group"><label>New pipeline stage</label><select name="stage">${opts(stages,c.stage)}</select></div><div class="form-group"><label>Next follow-up date</label><input type="date" name="nextFollowup" value="${clean(c.nextFollowup||'')}"/></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save activity</button></div></form>`) }
function submitActivity(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));db.activities.push({id:uuid(),contactId:id,date:o.date,type:o.type,notes:o.notes});const c=db.contacts.find(x=>x.id===id);c.stage=o.stage;c.nextFollowup=o.nextFollowup;c.lastContact=o.date;save();closeModal();render();toast('Activity logged')}
function openTemplate(id){const t=db.templates.find(x=>x.id===id)||{title:'',audience:'Other',channel:'Email',aim:'Idea discussion',subject:'',body:''};editTemplate=id||null;modal(`<h2>${id?'Edit message template':'Create message template'}</h2><form onsubmit="submitTemplate(event)"><div class="form-group"><label>Template name *</label><input name="title" required value="${clean(t.title)}"/></div><div class="form-row three"><div class="form-group"><label>Audience</label><select name="audience">${opts(audiences,t.audience)}</select></div><div class="form-group"><label>Channel</label><select name="channel">${opts(channels,t.channel)}</select></div><div class="form-group"><label>Objective</label><select name="aim">${opts(aims,t.aim)}</select></div></div><div class="form-group"><label>Subject (email only)</label><input name="subject" value="${clean(t.subject)}"/></div><div class="form-group"><label>Message body *</label><textarea rows="11" name="body" required>${clean(t.body)}</textarea><small>Use {{name}}, {{organization}}, {{topic}}, {{sender}} to personalise.</small></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save template</button></div></form>`) }
function submitTemplate(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(!o.title.trim()||!o.body.trim())return;const t=db.templates.find(x=>x.id===editTemplate);if(t)Object.assign(t,o);else{const id=uuid();db.templates.push({...o,id});selectedTemplate=id}save();closeModal();render();toast('Template saved')}
function deleteTemplate(id){if(!confirm('Delete this message template?'))return;db.templates=db.templates.filter(t=>t.id!==id);removeCloud('templates',id);selectedTemplate=db.templates[0]?.id;save();render();toast('Template deleted')}
function download(filename,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportJSON(){download('manifesto-outreach-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded')}
function exportCSV(){let fields=['name','organization','title','audience','goal','stage','channel','email','phone','linkedin','lastContact','nextFollowup','notes'];let csv=[fields.join(','),...db.contacts.map(c=>fields.map(f=>'"'+String(c[f]||'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download('manifesto-contacts-'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV downloaded')}
async function importJSON(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.contacts)||!Array.isArray(data.templates)||!Array.isArray(data.activities)||!data.settings)throw new Error('Invalid backup');if(!confirm('Replace ALL current contacts, templates and activity with this backup?'))return;db=data;save();selectedTemplate=db.templates[0]?.id;render();toast('Backup imported')}catch(e){alert('Could not import file: '+e.message)}}
function clearData(){if(!confirm('Permanently delete all cloud and locally stored contacts, templates and activities? Export a backup first.'))return;clearCloud();db=blank();save();selectedTemplate=db.templates[0]?.id;goto('dashboard');toast('Cloud and local data reset')}
render();
initialiseCloud();
</script>
</body></html>
